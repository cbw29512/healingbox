<style>
:root{--ink:#241710;--paper:#f2dfad;--paper2:#dfc286;--wood:#4d2414;--wood2:#28120c;--gold:#c69a45;--red:#7a2721;--green:#3d7645;--spent:#716b62;--blue:#345d73}*{box-sizing:border-box}body{margin:0;background:#150c09;color:var(--ink);font-family:Georgia,serif;min-height:100vh}button,input,select{font:inherit}.page{width:min(1200px,100%);margin:auto;min-height:100vh;padding:14px;background:radial-gradient(circle at 50% 0,#6e4b31,#21120e 65%)}header{text-align:center;color:#fff0c2;padding:16px}.artifact{letter-spacing:.22em;text-transform:uppercase;color:#e7bc61;font-weight:bold;font-size:.8rem}h1{font-size:clamp(2.5rem,8vw,5rem);margin:.1rem 0}header p{margin:.25rem}.status{display:inline-flex;align-items:center;gap:7px;background:#0005;border:1px solid #b98739;padding:.35rem .7rem;border-radius:999px}.dot{width:10px;height:10px;border-radius:50%;background:#a98740}.dot.on{background:#42ad59}.panel{background:linear-gradient(#f8e9be,#e5cc91);border:2px solid var(--gold);border-radius:12px;padding:18px;box-shadow:0 12px 35px #0007}.setup{max-width:760px;margin:20px auto}.tabs,.actions{display:flex;gap:9px;flex-wrap:wrap}.tabs button{flex:1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:5px;font-weight:bold}input,select{width:100%;padding:.72rem;border:1px solid #8f6931;border-radius:7px;background:#fffaf0}.btn{border:1px solid #3c130f;border-radius:7px;padding:.7rem 1rem;background:linear-gradient(#963a32,#651e19);color:#fff3d2;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 #2d0e0b}.btn.blue{background:linear-gradient(#4e7890,#29495b);border-color:#162c37}.btn.gold{background:linear-gradient(#d3a853,#8d6422);color:#26180b}.btn.light{background:#fff5d8;color:#2b1a11;box-shadow:none;border-color:#98713a}.btn:disabled{opacity:.4;cursor:not-allowed}.hidden{display:none!important}.closed{text-align:center;padding:24px}.chest-closed{font-size:10rem;line-height:1;filter:drop-shadow(0 18px 12px #0007);transition:.5s}.closed.opening .chest-closed{transform:translateY(8px) scale(1.03)}.openbox{background:linear-gradient(90deg,#2c140d,#6a351d 7%,#8e512b 50%,#6a351d 93%,#2c140d);border:5px ridge #c99a42;border-radius:16px;padding:14px;box-shadow:inset 0 0 35px #160905,0 15px 45px #0008}.lid{background:linear-gradient(#58301d,#2f160e);border:4px ridge #bd8b35;border-radius:16px 16px 8px 8px;padding:14px;color:#ffecb5;text-align:center;box-shadow:inset 0 0 28px #0009;margin-bottom:12px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.round{font-size:1.25rem;font-weight:bold}.limit{display:inline-block;padding:.3rem .55rem;border-radius:6px;margin:3px;background:#1d0e0a;border:1px solid #a97b31}.limit.used{background:#5d2520;color:#ffdad2}.inside{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:14px}.slots-area,.party-area{background:#180b08b8;border:2px inset #b98538;border-radius:10px;padding:12px;color:#ffedbd}.level-row{margin-bottom:13px}.level-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;color:#f3cc73}.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px}.slot{min-height:122px;text-align:left;padding:10px;border-radius:9px;border:2px solid #c79b49;background:linear-gradient(145deg,#fff3c8,#dcbf80);color:#28180e;cursor:pointer;position:relative;box-shadow:0 4px 0 #5f391b}.slot:hover{transform:translateY(-2px)}.slot.used{background:linear-gradient(#8a857b,#66615a);border-color:#aaa49b;color:#ece8df;box-shadow:none;cursor:default;filter:saturate(.3)}.slot .tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:#74231e}.slot.used .tag{color:#f0ddd9}.slot b{display:block;font-size:1.05rem;margin:.3rem 0}.slot small{display:block}.party-card{background:#fff1c8;color:#27170f;border:1px solid #b58339;border-radius:8px;padding:9px;margin:8px 0}.party-head{display:flex;justify-content:space-between;gap:8px;font-weight:bold}.hpbar{height:13px;border:1px solid #4c2b18;border-radius:999px;background:#c9aa7c;overflow:hidden;margin:6px 0}.hpbar span{display:block;height:100%;background:linear-gradient(90deg,#9b2924,#4d9a4f)}.hp-controls{display:grid;grid-template-columns:1fr auto auto;gap:5px}.hp-controls input{padding:.35rem}.mini{padding:.35rem .55rem;border:1px solid #6f461e;border-radius:5px;background:#ffe8a9;cursor:pointer}.summary{background:#fff0c1;color:#28180f;border-radius:8px;padding:10px;margin-top:10px}.summary-grid{display:grid;grid-template-columns:1fr auto;gap:5px}.ledger{margin-top:14px;background:#f5e4b4;border:2px solid #bd8e3d;border-radius:10px;padding:14px}.ledger ol{max-height:260px;overflow:auto;margin:0;padding-left:1.4rem}.ledger li{padding:5px;border-bottom:1px dashed #aa8144}.empty{font-style:italic;opacity:.75}.note{padding:9px;border-left:5px solid #b37f2e;background:#fff1c3;margin:10px 0}dialog{width:min(680px,95vw);max-height:92vh;overflow:auto;border:2px solid #c39749;border-radius:12px;background:#f1dfad;color:#26170f;box-shadow:0 25px 70px #0009}dialog::backdrop{background:#100907d9}.modal{display:grid;gap:12px}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{padding:15px;border:2px solid #a87a34;border-radius:9px;background:#fff5d5;text-align:center;cursor:pointer}.choice:hover{background:#ffe7a6}.spellcard{background:#fff8df;border:2px solid #9c7137;border-radius:10px;padding:14px}.spellmeta{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.spellmeta div{background:#f0dfb2;padding:7px;border-radius:5px}.targets{display:grid;grid-template-columns:1fr 1fr;gap:7px}.check{display:flex;align-items:center;gap:7px;font-weight:normal}.check input{width:auto}.warn{color:#7a211c;font-weight:bold}.loading{text-align:center;padding:12px}@media(max-width:820px){.inside{grid-template-columns:1fr}.grid2,.choice-grid,.spellmeta,.targets{grid-template-columns:1fr}.slot-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.page{padding:7px}.chest-closed{font-size:7rem}}@media(max-width:420px){.slot-grid{grid-template-columns:1fr}.toolbar{display:block}.btn{width:100%;margin-top:5px}}

</head><body><div class="page"><header><div class="artifact">Unique Artifact</div><h1>Cleric in a Box</h1><p>The party’s shared divine slot, healing, scroll, and combat tracker.</p><div class="status"><i id="dot" class="dot"></i><span id="status">Not connected</span></div></header><main id="app"></main></div>
<dialog id="slotDialog"><div class="modal"><h2 id="slotTitle"></h2><div id="slotBody"></div><button class="btn light" onclick="slotDialog.close()">Close</button></div></dialog>
<dialog id="spellDialog"><div class="modal"><h2 id="spellTitle"></h2><div id="spellBody"></div><button class="btn light" onclick="spellDialog.close()">Close</button></div></dialog>
<script>
'use strict';
const SLOTS={1:[2],2:[3],3:[4,2],4:[4,3],5:[4,3,2],6:[4,3,3],7:[4,3,3,1],8:[4,3,3,2],9:[4,3,3,3,1],10:[4,3,3,3,2],11:[4,3,3,3,2,1],12:[4,3,3,3,2,1],13:[4,3,3,3,2,1,1],14:[4,3,3,3,2,1,1],15:[4,3,3,3,2,1,1,1],16:[4,3,3,3,2,1,1,1],17:[4,3,3,3,2,1,1,1,1],18:[4,3,3,3,3,1,1,1,1],19:[4,3,3,3,3,2,1,1,1],20:[4,3,3,3,3,2,2,1,1]};
const POTION=l=>l===1?{name:'Potion of Healing',dice:'2d4+2'}:l<=3?{name:'Greater Healing Potion',dice:'4d4+4'}:l<=6?{name:'Superior Healing Potion',dice:'8d4+8'}:{name:'Supreme Healing Potion',dice:'10d4+20'};
const SPELLS={1:['Bane','Bless','Command','Create or Destroy Water','Cure Wounds','Detect Evil and Good','Detect Magic','Detect Poison and Disease','Guiding Bolt','Healing Word','Inflict Wounds','Protection from Evil and Good','Purify Food and Drink','Sanctuary','Shield of Faith'],2:['Aid','Augury','Blindness/Deafness','Calm Emotions','Continual Flame','Enhance Ability','Find Traps','Gentle Repose','Hold Person','Lesser Restoration','Locate Object','Prayer of Healing','Protection from Poison','Silence','Spiritual Weapon','Warding Bond','Zone of Truth'],3:['Animate Dead','Beacon of Hope','Bestow Curse','Clairvoyance','Create Food and Water','Daylight','Dispel Magic','Glyph of Warding','Magic Circle','Mass Healing Word','Meld into Stone','Protection from Energy','Remove Curse','Revivify','Sending','Speak with Dead','Spirit Guardians','Tongues','Water Walk'],4:['Banishment','Control Water','Death Ward','Divination','Freedom of Movement','Guardian of Faith','Locate Creature','Stone Shape'],5:['Commune','Contagion','Dispel Evil and Good','Flame Strike','Geas','Greater Restoration','Hallow','Insect Plague','Legend Lore','Mass Cure Wounds','Planar Binding','Raise Dead','Scrying'],6:['Blade Barrier','Create Undead','Find the Path','Forbiddance','Harm','Heal','Heroes’ Feast','Planar Ally','True Seeing','Word of Recall'],7:['Conjure Celestial','Divine Word','Etherealness','Fire Storm','Plane Shift','Regenerate','Resurrection','Symbol'],8:['Antimagic Field','Control Weather','Earthquake','Holy Aura'],9:['Astral Projection','Gate','Mass Heal','True Resurrection']};
const CORE={
'Bless':{school:'Enchantment',casting:'1 action',range:'30 feet',components:'V, S, M',duration:'Concentration, up to 1 minute',save:'None',damage:'None',healing:'None',targets:'Up to 3 creatures',effect:'Targets add 1d4 to attack rolls and saving throws while the spell lasts.'},
'Cure Wounds':{school:'Abjuration',casting:'1 action',range:'Touch',components:'V, S',duration:'Instantaneous',save:'None',damage:'None',healing:'2014: 1d8 + spellcasting modifier. 2024: 2d8 + spellcasting modifier.',targets:'1 creature',effect:'The target regains hit points. This spell has no effect on Constructs or Undead.'},
'Healing Word':{school:'Abjuration',casting:'1 bonus action',range:'60 feet',components:'V',duration:'Instantaneous',save:'None',damage:'None',healing:'2014: 1d4 + spellcasting modifier. 2024: 2d4 + spellcasting modifier.',targets:'1 creature',effect:'The target regains hit points. This spell has no effect on Constructs or Undead.'},
'Guiding Bolt':{school:'Evocation',casting:'1 action',range:'120 feet',components:'V, S',duration:'1 round',save:'Spell attack',damage:'4d6 radiant',healing:'None',targets:'1 creature',effect:'On a hit, the next attack roll against the target before the end of your next turn has advantage.'},
'Aid':{school:'Abjuration',casting:'1 action',range:'30 feet',components:'V, S, M',duration:'8 hours',save:'None',damage:'None',healing:'Raises current and maximum HP by 5',targets:'Up to 3 creatures',effect:'Each target’s hit point maximum and current hit points increase for the duration.'},
'Prayer of Healing':{school:'Abjuration',casting:'10 minutes',range:'30 feet',components:'V',duration:'Instantaneous',save:'None',damage:'None',healing:'2d8 + spellcasting modifier',targets:'Up to 6 creatures',effect:'Chosen creatures regain hit points; not normally practical during combat because of casting time.'},
'Mass Healing Word':{school:'Abjuration',casting:'1 bonus action',range:'60 feet',components:'V',duration:'Instantaneous',save:'None',damage:'None',healing:'2014: 1d4 + modifier. 2024: 2d4 + modifier.',targets:'Up to 6 creatures',effect:'Chosen creatures regain hit points.'},
'Revivify':{school:'Necromancy',casting:'1 action',range:'Touch',components:'V, S, M (diamonds worth 300 gp, consumed)',duration:'Instantaneous',save:'None',damage:'None',healing:'Returns with 1 HP',targets:'1 creature dead no longer than 1 minute',effect:'Returns the creature to life with 1 hit point. Does not restore missing body parts.'},
'Spirit Guardians':{school:'Conjuration',casting:'1 action',range:'Self (15-foot emanation)',components:'V, S, M',duration:'Concentration, up to 10 minutes',save:'Wisdom',damage:'3d8 radiant or necrotic; half on save',healing:'None',targets:'Chosen creatures in the area',effect:'Affected creatures have reduced speed and take damage when the spell’s timing condition occurs. Use the selected edition’s exact timing at the table.'},
'Mass Cure Wounds':{school:'Abjuration',casting:'1 action',range:'60 feet',components:'V, S',duration:'Instantaneous',save:'None',damage:'None',healing:'2014: 3d8 + modifier. 2024: 5d8 + modifier.',targets:'Up to 6 creatures in a 30-foot-radius sphere',effect:'Chosen creatures regain hit points.'},
'Heal':{school:'Abjuration',casting:'1 action',range:'60 feet',components:'V, S',duration:'Instantaneous',save:'None',damage:'None',healing:'70 HP',targets:'1 creature',effect:'Restores hit points and ends certain conditions. Does not affect Constructs or Undead.'},
'Mass Heal':{school:'Abjuration',casting:'1 action',range:'60 feet',components:'V, S',duration:'Instantaneous',save:'None',damage:'None',healing:'700 HP divided among targets',targets:'Any creatures you can see in range',effect:'Distribute 700 hit points among creatures; also ends certain conditions.'}
};
let state=null,room='',isHost=false,peer=null,hostConn=null,connections=[],selectedSlot=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function mkState(o){return{campaign:o.campaign||'Campaign',rules:Number(o.rules)||2014,level:Number(o.level)||1,open:false,round:1,scrollRound:0,chars:[],slots:makeSlots(Number(o.level)||1),log:[]}}
function makeSlots(level){const out=[];(SLOTS[level]||SLOTS[1]).forEach((n,i)=>{for(let x=1;x<=n;x++)out.push({id:`L${i+1}-${x}`,level:i+1,index:x,used:false,mode:null,title:null,detail:null})});return out}
function randCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',v=new Uint32Array(6);crypto.getRandomValues(v);return [...v].map(n=>a[n%a.length]).join('')}
function status(t,on=false){$('#status').textContent=t;$('#dot').className='dot'+(on?' on':'')}
function log(t){state.log.push({time:Date.now(),text:t})}
function save(){if(isHost&&room)localStorage.setItem('cib-'+room,JSON.stringify(state))}
function broadcast(){save();render();connections.filter(c=>c.open).forEach(c=>c.send({type:'state',state,room}))}
function appSetup(){return `<section class="panel setup"><div class="tabs"><button class="btn" id="createTab">Create Party</button><button class="btn blue" id="joinTab">Join Party</button></div><div id="createPane"><h2>Bind the Artifact to a Party</h2><div class="grid2"><label>Campaign<input id="campaign" value="My Campaign"></label><label>Rules<select id="rules"><option>2014</option><option>2024</option></select></label><label>Average party level<select id="level">${Array.from({length:20},(_,i)=>`<option>${i+1}</option>`).join('')}</select></label><label>Granting deity<input id="deity" placeholder="DM-controlled deity"></label></div><button class="btn gold" id="create" style="width:100%;margin-top:12px">Create the Unique Artifact</button></div><div id="joinPane" class="hidden"><h2>Join the Party</h2><div class="grid2"><label>Your name<input id="playerName"></label><label>Room code<input id="joinCode" maxlength="6"></label></div><button class="btn blue" id="join" style="width:100%;margin-top:12px">Join the Box</button></div><div class="note">The DM’s browser hosts the shared tracker and must stay open during play.</div></section>`}
function closedView(){return `<section class="panel closed"><div class="chest-closed">🧰</div><h2>${esc(state.campaign)}</h2><p>Level ${state.level} · ${state.rules} rules · Room <b>${room}</b></p>${isHost?'<button class="btn gold" id="openChest">Open Cleric in a Box</button>':'<p>The artifact is waiting for the DM to open it.</p>'}</section>`}
function usedCounts(){const x={potion:0,scroll:0};state.slots.filter(s=>s.used).forEach(s=>x[s.mode]++);return x}
function openView(){const u=usedCounts(),left=state.slots.length-u.potion-u.scroll;return `<section class="openbox"><div class="lid"><div class="toolbar"><div><b>${esc(state.campaign)}</b> · Level ${state.level} · ${state.rules}</div><div class="round">Round ${state.round}</div></div><div><span class="limit ${state.scrollRound===state.round?'used':''}">Scroll this round: ${state.scrollRound===state.round?'USED':'AVAILABLE'}</span><span class="limit">Unused slots: ${left}/${state.slots.length}</span></div><div class="actions">${isHost?'<button class="btn gold" id="nextRound">Advance Round</button><button class="btn light" id="addChar">Add Character</button><button class="btn light" id="longRest">Long Rest</button>':''}<button class="btn light" id="copyLink">Copy Join Link</button></div></div><div class="inside"><div class="slots-area"><h2>Divine Flex Slots</h2>${slotRows()}</div><aside class="party-area"><h2>Party</h2>${state.chars.length?state.chars.map(charCard).join(''):'<p class="empty">Add party members to track HP and potion limits.</p>'}<div class="summary"><b>Remaining Healing Capacity</b><div class="summary-grid">${capacity()}</div></div></aside></div></section><section class="ledger"><h2>Divine Ledger</h2>${state.log.length?`<ol>${state.log.slice().reverse().map(x=>`<li><small>${new Date(x.time).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</small> ${esc(x.text)}</li>`).join('')}</ol>`:'<p class="empty">No slots have been used today.</p>'}</section>`}
function slotRows(){return [...new Set(state.slots.map(s=>s.level))].map(l=>{const ss=state.slots.filter(s=>s.level===l);return `<div class="level-row"><div class="level-title"><b>${ordinal(l)}-Level Slots</b><span>${ss.filter(s=>!s.used).length} available</span></div><div class="slot-grid">${ss.map(slotCard).join('')}</div></div>`}).join('')}
function slotCard(s){return `<button class="slot ${s.used?'used':''}" data-slot="${s.id}" ${s.used?'disabled':''}><span class="tag">${s.used?'Spent':'Flexible Divine Slot'}</span><b>${ordinal(s.level)} Level · Slot ${s.index}</b><small>${s.used?`${esc(s.title)}<br>${esc(s.detail||'')}`:`Choose ${POTION(s.level).name} or any ${ordinal(s.level)}-level cleric scroll.`}</small></button>`}
function charCard(c){const pct=Math.max(0,Math.min(100,c.hp/c.max*100));return `<div class="party-card"><div class="party-head"><span>${esc(c.name)}</span><span>${c.hp}/${c.max}</span></div><div class="hpbar"><span style="width:${pct}%"></span></div><small>Box potion this round: ${c.potionRound===state.round?'USED':'available'}</small><div class="hp-controls"><input type="number" min="1" value="1" data-amt="${c.id}"><button class="mini" data-hp="${c.id}" data-dir="-1">−</button><button class="mini" data-hp="${c.id}" data-dir="1">+</button></div></div>`}
function capacity(){const c={};state.slots.filter(s=>!s.used).forEach(s=>{const p=POTION(s.level).name;c[p]=(c[p]||0)+1});return Object.entries(c).map(([k,v])=>`<span>${k}</span><b>${v}</b>`).join('')||'<span>No healing remains</span><b>0</b>'}
function render(){if(!state)$('#app').innerHTML=appSetup();else $('#app').innerHTML=state.open?openView():closedView();bind()}
function bind(){if(!state){$('#createTab').onclick=()=>{$('#createPane').classList.remove('hidden');$('#joinPane').classList.add('hidden')};$('#joinTab').onclick=()=>{$('#joinPane').classList.remove('hidden');$('#createPane').classList.add('hidden')};$('#create').onclick=createParty;$('#join').onclick=joinParty;return}if(!state.open){if($('#openChest'))$('#openChest').onclick=()=>send({type:'open'});return}$$('[data-slot]').forEach(b=>b.onclick=()=>chooseSlot(b.dataset.slot));$$('[data-hp]').forEach(b=>b.onclick=()=>{const id=b.dataset.hp,amt=Number($(`[data-amt="${id}"]`).value)||1;send({type:'hp',id,delta:Number(b.dataset.dir)*amt})});if($('#nextRound'))$('#nextRound').onclick=()=>send({type:'nextRound'});if($('#addChar'))$('#addChar').onclick=addChar;if($('#longRest'))$('#longRest').onclick=()=>{if(confirm('Restore every slot and begin a new adventuring day?'))send({type:'rest'})};$('#copyLink').onclick=copyLink}
function createParty(){room=randCode();state=mkState({campaign:$('#campaign').value,rules:$('#rules').value,level:$('#level').value});isHost=true;startHost();render()}
function startHost(){status('Opening room…');peer=new Peer('cleric-box-'+room.toLowerCase());peer.on('open',()=>{status('Hosting '+room,true);history.replaceState({},'',location.pathname+'?host='+room);broadcast()});peer.on('connection',c=>{connections.push(c);c.on('open',()=>c.send({type:'state',state,room}));c.on('data',d=>{if(d.type==='action')apply(d.action,d.name||'Player')});c.on('close',()=>connections=connections.filter(x=>x!==c))});peer.on('error',e=>status('Connection error: '+e.type))}
function joinParty(){const name=$('#playerName').value.trim()||'Player';room=$('#joinCode').value.trim().toUpperCase();if(room.length!==6)return alert('Enter the six-character room code.');peer=new Peer();status('Connecting…');peer.on('open',()=>{hostConn=peer.connect('cleric-box-'+room.toLowerCase(),{reliable:true});hostConn.on('open',()=>status('Connected',true));hostConn.on('data',d=>{if(d.type==='state'){state=d.state;render()}});hostConn.on('close',()=>status('DM disconnected'))});window.playerName=name}
function send(a){if(isHost)apply(a,'DM');else if(hostConn?.open)hostConn.send({type:'action',action:a,name:window.playerName||'Player'});else alert('The DM host is not connected.')}
function apply(a,actor){try{if(a.type==='open'){state.open=true;log('The unique artifact opened for the party.')}else if(a.type==='hp'){const c=state.chars.find(x=>x.id===a.id);const before=c.hp;c.hp=Math.max(0,Math.min(c.max,c.hp+a.delta));log(`${actor} adjusted ${c.name}: ${before} → ${c.hp} HP.`)}else if(a.type==='addChar'){state.chars.push({id:crypto.randomUUID(),name:a.name,max:a.max,hp:a.hp,potionRound:0})}else if(a.type==='nextRound'){state.round++;log(`Combat advanced to round ${state.round}. Scroll and individual potion limits reset.`)}else if(a.type==='rest'){state.slots=makeSlots(state.level);state.round=1;state.scrollRound=0;state.chars.forEach(c=>c.potionRound=0);state.log=[];log('The party completed a long rest. Every divine slot was restored.')}else if(a.type==='usePotion')usePotion(a,actor);else if(a.type==='useScroll')useScroll(a,actor);broadcast()}catch(e){alert(e.message)}}
function addChar(){const name=prompt('Character name:');if(!name)return;const max=Math.max(1,Number(prompt('Maximum HP:','50'))||50);const hp=Math.max(0,Math.min(max,Number(prompt('Current HP:',max))||max));send({type:'addChar',name,max,hp})}
function chooseSlot(id){selectedSlot=state.slots.find(s=>s.id===id);const p=POTION(selectedSlot.level);$('#slotTitle').textContent=`${ordinal(selectedSlot.level)}-Level Slot ${selectedSlot.index}`;$('#slotBody').innerHTML=`<div class="choice-grid"><button class="choice" id="choosePotion"><b>🧪 ${p.name}</b><br>${p.dice}<br><small>One target; once per person each round.</small></button><button class="choice" id="chooseScroll"><b>📜 Cleric Scroll</b><br>Any exact ${ordinal(selectedSlot.level)}-level cleric spell<br><small>One box scroll per round.</small></button></div>`;$('#choosePotion').onclick=showPotion;$('#chooseScroll').onclick=showSpellList;slotDialog.showModal()}
function showPotion(){const p=POTION(selectedSlot.level);$('#slotBody').innerHTML=`<h3>${p.name}</h3><p><b>Healing:</b> ${p.dice}</p><label>Recipient<select id="pTarget">${state.chars.map(c=>`<option value="${c.id}" ${c.potionRound===state.round?'disabled':''}>${esc(c.name)} — ${c.hp}/${c.max}${c.potionRound===state.round?' (already used this round)':''}</option>`).join('')}</select></label><button class="btn gold" id="drink">Roll, Administer, and Spend Slot</button>`;$('#drink').onclick=()=>{send({type:'usePotion',slotId:selectedSlot.id,targetId:$('#pTarget').value});slotDialog.close()}}
function showSpellList(){if(state.scrollRound===state.round){$('#slotBody').innerHTML='<p class="warn">The box has already read a scroll this round.</p>';return}const list=SPELLS[selectedSlot.level]||[];$('#slotBody').innerHTML=`<label>Choose exact-level cleric spell<select id="spellSelect">${list.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label><button class="btn blue" id="viewSpell">View Combat Card</button>`;$('#viewSpell').onclick=()=>openSpellCard($('#spellSelect').value)}
async function openSpellCard(name){slotDialog.close();$('#spellTitle').textContent=name;$('#spellBody').innerHTML='<div class="loading">Loading combat reference…</div>';spellDialog.showModal();let d=CORE[name]||null;if(!d&&state.rules===2014){try{const slug=name.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const r=await fetch('https://www.dnd5eapi.co/api/2014/spells/'+slug);if(r.ok){const x=await r.json();d={school:x.school?.name||'—',casting:x.casting_time||'—',range:x.range||'—',components:(x.components||[]).join(', ')+(x.material?' ('+x.material+')':''),duration:x.duration||'—',save:x.dc?x.dc.dc_type?.name||'Saving throw':'None',damage:x.damage?.damage_at_slot_level?.[selectedSlot.level]||x.damage?.damage_at_character_level?.[state.level]||'See effect',healing:x.heal_at_slot_level?.[selectedSlot.level]||'None',targets:'See effect',effect:(x.desc||[]).join(' ')}}}catch(e){console.warn(e)}}if(!d)d={school:'Cleric spell',casting:'See selected rules source',range:'See selected rules source',components:'See selected rules source',duration:'See selected rules source',save:'See selected rules source',damage:'See selected rules source',healing:'See selected rules source',targets:'See selected rules source',effect:'This spell is selectable in the testing build, but its full licensed combat text is not bundled yet. Verify the exact 2014 or 2024 source text before casting.'};renderSpellCard(name,d)}
function renderSpellCard(name,d){const needsTargets=/heal|cure|aid|reviv|regener|resurrection/i.test(name);$('#spellBody').innerHTML=`<div class="spellcard"><div class="spellmeta"><div><b>Level</b><br>${ordinal(selectedSlot.level)}</div><div><b>School</b><br>${esc(d.school)}</div><div><b>Normal casting</b><br>${esc(d.casting)}</div><div><b>Box activation</b><br>Free action</div><div><b>Range / Area</b><br>${esc(d.range)}</div><div><b>Duration</b><br>${esc(d.duration)}</div><div><b>Components</b><br>${esc(d.components)}</div><div><b>Attack / Save</b><br>${esc(d.save)}</div><div><b>Damage</b><br>${esc(d.damage)}</div><div><b>Healing</b><br>${esc(d.healing)}</div><div><b>Targets</b><br>${esc(d.targets)}</div><div><b>Round limit</b><br>One scroll for the entire box</div></div><h3>Combat Effect</h3><p>${esc(d.effect)}</p>${needsTargets?`<div class="targets">${state.chars.map(c=>`<label class="check"><input type="checkbox" value="${c.id}">${esc(c.name)} (${c.hp}/${c.max})</label>`).join('')}</div>`:''}<p class="warn">Casting spends this exact slot and locks all scrolls until the next round.</p><button class="btn blue" id="cast">The Box Reads This Scroll</button></div>`;$('#cast').onclick=()=>{const targets=$$('#spellBody input:checked').map(x=>x.value);send({type:'useScroll',slotId:selectedSlot.id,spell:name,targets});spellDialog.close()}}
function roll(expr){const m=expr.match(/(\d+)d(\d+)(?:\+(\d+))?/);if(!m)return{total:0,detail:expr};let total=+(m[3]||0),rs=[];for(let i=0;i<+m[1];i++){const v=new Uint32Array(1);crypto.getRandomValues(v);const n=v[0]%+m[2]+1;rs.push(n);total+=n}return{total,detail:rs.join(' + ')+(m[3]?` + ${m[3]}`:'')}}
function usePotion(a,actor){const s=state.slots.find(x=>x.id===a.slotId),c=state.chars.find(x=>x.id===a.targetId);if(!s||s.used)throw Error('That slot is no longer available.');if(!c)throw Error('Choose a party member.');if(c.potionRound===state.round)throw Error(`${c.name} has already received a box potion this round.`);const p=POTION(s.level),r=roll(p.dice),before=c.hp;c.hp=Math.min(c.max,c.hp+r.total);c.potionRound=state.round;s.used=true;s.mode='potion';s.title=p.name;s.detail=`${c.name}: ${before}→${c.hp} HP`;log(`${actor} used ${s.id} as ${p.name}. Rolled ${r.detail} = ${r.total}; ${c.name} ${before} → ${c.hp} HP.`)}
function useScroll(a,actor){const s=state.slots.find(x=>x.id===a.slotId);if(!s||s.used)throw Error('That slot is no longer available.');if(state.scrollRound===state.round)throw Error('The box has already read one scroll this round.');if(!(SPELLS[s.level]||[]).includes(a.spell))throw Error('That spell does not match this slot level.');s.used=true;s.mode='scroll';s.title=a.spell;s.detail=`Round ${state.round}`;state.scrollRound=state.round;log(`${actor} used ${s.id} as a ${a.spell} scroll. The box read it as a free action. Scroll access is locked until round ${state.round+1}.`)}
function copyLink(){const u=location.origin+location.pathname+'?join='+room;navigator.clipboard?.writeText(u).then(()=>alert('Join link copied.')).catch(()=>prompt('Copy link:',u))}
function ordinal(n){return n+(n===1?'st':n===2?'nd':n===3?'rd':'th')}
(function boot(){const q=new URLSearchParams(location.search),h=q.get('host'),j=q.get('join');if(h){room=h.toUpperCase();try{state=JSON.parse(localStorage.getItem('cib-'+room)||'null')}catch{}if(state){isHost=true;startHost();render();return}}render();if(j){$('#joinTab').click();$('#joinCode').value=j.toUpperCase()}})();
</script></body></html>
