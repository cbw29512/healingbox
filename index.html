<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3a2016">
  <title>Cleric in a Box</title>
  <meta name="description" content="A live multiplayer D&D 5e healing-potion and exact-level cleric-scroll tracker.">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
</head>
<body>
  <div class="shell">
    <header>
      <div class="kicker">Unique Artifact</div>
      <h1>Cleric <span>in a Box</span></h1>
      <p class="subtitle">The party’s shared healing-potion and exact-level cleric-scroll tracker. It rolls the dice, records the result, and greys out each divine charge when spent.</p>
      <div class="status"><i id="dot" class="dot"></i><span id="connectionText">Not connected</span></div>
    </header>
    <main id="app"></main>
  </div>

  <dialog id="scrollDialog">
    <form method="dialog" class="modal-grid">
      <h2 id="scrollTitle">Use Scroll</h2>
      <label>Choose a cleric spell
        <select id="scrollSpell"></select>
      </label>
      <label id="customSpellWrap" class="hidden">Custom cleric spell
        <input id="customSpell" placeholder="Spell name">
      </label>
      <label>Target or note (optional)
        <input id="scrollNote" placeholder="Goblin chief, whole party, east hallway…">
      </label>
      <div id="spellPreview" class="preview"></div>
      <div class="notice">No upcasting: this scroll spends only the exact-level charge shown.</div>
      <button id="castScroll" type="button" class="btn">The Box Reads the Scroll</button>
      <button class="btn ghost" value="cancel">Cancel</button>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
