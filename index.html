<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3a2016">
  <title>Cleric in a Box</title>
  <meta name="description" content="A live multiplayer D&D 5e healing-potion and exact-level cleric-scroll tracker.">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
</head>
<body>
  <div class="shell">
    <header>
      <div class="kicker">Unique Artifact</div>
      <h1>Cleric <span>in a Box</span></h1>
      <p class="subtitle">The party’s shared healing-potion and exact-level cleric-scroll tracker. It rolls the dice, records the result, and greys out each divine charge when spent.</p>
      <div class="status"><i id="dot" class="dot"></i><span id="connectionText">Not connected</span></div>
    </header>
    <main id="app"></main>
  </div>

  <dialog id="scrollDialog">
    <form method="dialog" class="modal-grid">
      <h2 id="scrollTitle">Use Scroll</h2>
      <label>Choose a cleric spell
        <select id="scrollSpell"></select>
      </label>
      <label id="customSpellWrap" class="hidden">Custom cleric spell
        <input id="customSpell" placeholder="Spell name">
      </label>
      <label>Target or note (optional)
        <input id="scrollNote" placeholder="Goblin chief, whole party, east hallway…">
      </label>
      <div id="spellPreview" class="preview"></div>
      <div class="notice">No upcasting: this scroll spends only the exact-level charge shown.</div>
      <button id="castScroll" type="button" class="btn">The Box Reads the Scroll</button>
      <button class="btn ghost" value="cancel">Cancel</button>
    </form>
  </dialog>

  <script>
  (()=>{
    const params=new URLSearchParams(location.search),room=(params.get('host')||'').toUpperCase();
    if(!room)return;
    const key=`cleric-box-${room}`;
    try{
      const old=JSON.parse(localStorage.getItem(key)||'null');
      if(!old||old.version===2&&Array.isArray(old.charges))return;
      const table={1:[2],2:[3],3:[4,2],4:[4,3],5:[4,3,2],6:[4,3,3],7:[4,3,3,1],8:[4,3,3,2],9:[4,3,3,3,1],10:[4,3,3,3,2],11:[4,3,3,3,2,1],12:[4,3,3,3,2,1],13:[4,3,3,3,2,1,1],14:[4,3,3,3,2,1,1],15:[4,3,3,3,2,1,1,1],16:[4,3,3,3,2,1,1,1],17:[4,3,3,3,2,1,1,1,1],18:[4,3,3,3,3,1,1,1,1],19:[4,3,3,3,3,2,1,1,1],20:[4,3,3,3,3,2,2,1,1]};
      const level=Math.max(1,Math.min(20,Number(old.level||old.partyLevel||1))),charges=[];
      (table[level]||table[1]).forEach((qty,index)=>{const spellLevel=index+1,potion=spellLevel===1?'healing':spellLevel<=3?'greater':spellLevel<=6?'superior':'supreme';for(let number=1;number<=qty;number++)charges.push({id:`L${spellLevel}-${number}`,level:spellLevel,number,potion,spent:false,usedAs:null,result:null,actor:null,time:null})});
      localStorage.setItem(key,JSON.stringify({version:2,campaign:old.campaign||old.campaignName||'My Campaign',deity:old.deity||old.deityName||'DM-controlled deity',ruleset:Number(old.ruleset)||2014,level,charges,log:[],createdAt:Date.now()}));
    }catch(error){console.error(error);localStorage.removeItem(key)}
  })();
  </script>
  <script src="script.js"></script>
</body>
</html>
